name: workflow.yml
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      #Check out code
      - name: checkout code
        uses: actions/checkout@v4
      # Run environment
      - name: set up java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      # Run tests
      - name: Run tests
        run: mvn -B test
      # Build application
      - name: Build application
        run: mvn -B package -DskipTests
