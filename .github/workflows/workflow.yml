name: workflow.yml
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: ${{ secrets.REVIEW_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.REVIEW_DB_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.REVIEW_DB_ROOT_PASS }}
          MYSQL_DATABASE: Review-service
        ports:
          - 3309:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      #Check out code
      - name: checkout code
        uses: actions/checkout@v5
      # Run environment
      - name: set up java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      # Run tests
      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.REVIEW_TEST_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.REVIEW_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.REVIEW_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B test
      # Build application
      - name: Build application
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.REVIEW_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.REVIEW_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.REVIEW_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B package -DskipTests

      - name: Login on DockerHub
        run: echo "${{secrets.DOCKER_HUB_TOKEN}}" | docker login -u "${{secrets.DOCKER_HUB_USER}}" --password-stdin

      - name: Build image
        run: |
          docker build -t beatasp/review-service:${{github.run_number}} .

      - name: push to Docker Hub
        run: |
          docker push beatasp/beatasp/review-service:${{github.run_number}}