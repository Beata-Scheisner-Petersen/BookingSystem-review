name: workflow.yml
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.REVIEW_DB_ROOT_PASS }}
          MYSQL_DATABASE: Review-service
        ports:
          - 3309:3306
        options: >
          --health-cmd="mysqladmin ping -h localhost -uroot -p ${{ secrets.REVIEW_DB_ROOT_PASS }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      #Check out code
      - name: checkout code
        uses: actions/checkout@v5
      # Run environment
      - name: set up java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      # Run tests
      - name: Run tests
        env:
          REVIEW_DB_URL: ${{ secrets.REVIEW_TEST_DB_URL }}
          REVIEW_DB_USER: ${{ secrets.REVIEW_DB_USER }}
          REVIEW_DB_PASS: ${{ secrets.REVIEW_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B test
      # Build application
      - name: Build application
        env:
          REVIEW_DB_URL: ${{ secrets.REVIEW_DB_URL }}
          REVIEW_DB_USER: ${{ secrets.REVIEW_DB_USER }}
          REVIEW_DB_PASS: ${{ secrets.REVIEW_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B package -DskipTests
